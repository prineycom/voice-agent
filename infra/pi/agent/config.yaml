# Agent Worker tool config — whitelist of CLI commands the LLM may run via run_command().
#
# run_command() parses its `args` string with shlex and checks the FIRST token
# against this list. Only commands listed here may be executed; anything else
# is rejected before exec. Add a command here + a pattern in skills/hermes.md,
# then restart the worker — no code change required.
worker_tools:
  allowed_commands:
    - hermes
    # - git      # add later if needed
    # - docker   # add later

  # ACP hybrid Hermes delegation (delegate_to_hermes). Hermes runs as a long-lived
  # `hermes acp` process; delegation returns synchronously if it finishes within
  # the fast window, else it backgrounds and the result is delivered proactively
  # (soft barge-in on a conversation pause) when ready. See
  # docs/adr/0022-hermes-acp-hybrid-delegation.md.
  fast_window_s: 8            # delegate_to_hermes blocks up to this long before backgrounding
  max_concurrent: 3           # max concurrent ACP sessions (fast + background combined)
  max_queued: 5                # FIFO overflow queue cap (beyond it: refuse + ask user to wait)
  task_timeout_s: 300          # hard ceiling per delegated task; over it → cancel + report failure
  delivery_fallback_s: 15      # max wait for a conversation pause before soft barge-in delivery
  output_limit_chars: 600      # trim each Hermes result to this before it reaches the LLM/TTS
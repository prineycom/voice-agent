model_list:
  - model_name: voice-agent
    litellm_params:
      # ONE-LINE MODEL-SWAP POINT (issue #13 req #3):
      # To switch providers or models, change only this line.
      # Format: "<transport_prefix>/<model_id>"
      # Examples:
      #   openai/qwen3.5-4b                       — local Qwen3.5-4B-MTP on the Desktop GPU (current, ADR 0014)
      #   openai/nemotron-3-super:cloud           — Ollama Cloud (former MVP, ADR 0004)
      #   openai/gpt-4.1                          — GPT-4.1 via direct OpenAI API
      model: openai/qwen3.5-4b

      # Local llama.cpp (llama-server) on the Desktop RTX 4070, OpenAI-compatible
      # /v1 on port 8004 (see infra/desktop/llm/). Reached over the LAN; the
      # tailnet address http://100.75.88.35:8004/v1 is the fallback if the LAN
      # subnet changes. The "openai/" prefix selects the OpenAI-compatible
      # transport; llama-server ignores the requested model id (single model
      # loaded), so any id after the prefix works.
      api_base: http://192.168.1.5:8004/v1

      # llama-server runs without an API key on the trusted LAN/tailnet, so this
      # is a non-empty placeholder. If the server is later started with
      # --api-key, set LLM_LOCAL_API_KEY in the proxy's environment to match.
      api_key: os.environ/LLM_LOCAL_API_KEY

general_settings:
  # Authenticates clients (the Agent Worker) to this LiteLLM proxy.
  # The Agent Worker's LLM_API_KEY env var must equal this master key.
  # The actual secret is set in the litellm systemd unit's EnvironmentFile
  # and is NOT committed to this repo.
  master_key: os.environ/LITELLM_MASTER_KEY
